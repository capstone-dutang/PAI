# destination_roi.yaml (템플릿)
#
# agent_node.verify_result 의 depth 기반 place(목적지 배치) 보조 검증에 쓰이는 ROI.
#
# 설계 근거 — 검증 시점 자세:
#   실물 ACT 에피소드는 home_pose 시작 → 태스크 → home_pose 복귀로 수집된다.
#   배포 시에도 act_node 가 chunk 를 끝내면 verify 직전 /go_home 으로 팔을
#   home_pose 에 고정한 뒤 verify_result 를 호출한다. 즉 verify 시점에 그리퍼는
#   이미 비어 있고 목적지에 물체를 놓은 뒤다 → 검증 대상은 grasp(집기)가 아니라
#   place(목적지에 놓였는가)다. (grasp 검증은 README "grasp 검증 정책" 절 — 미래 확장.)
#
# 표현 — 픽셀 ROI + baseline depth (intrinsics 비의존):
#   카메라 고정 + 목적지(통/목표 영역) 고정 전제이므로, 목적지는 이미지에서 고정된
#   픽셀 영역이다. 따라서 미터 3D 박스(역투영) 대신 픽셀 ROI 로 표현한다.
#   → agent_node 는 camera intrinsics 에 의존하지 않는다 (README 결정 유지).
#
# 검증 원리:
#   verify 시점 RealSense depth 의 목적지 ROI median 을 재고, 빈 목적지 기준
#   (baseline_depth)보다 depth_change_threshold 이상 "가까워졌으면"(물체가 쌓여
#   카메라에 가까움) place 성공 흔적으로 본다. depth 는 단방향 veto 보조 신호이며
#   (agent_node._combine_verify), Gemma 시각 검증을 보강할 뿐 단독 SUCCESS 승격은 없다.
#
# 운영 배포:
#   ~/calibration/destination_roi.yaml 로 복사 후 agent_node 의 destination_roi
#   파라미터가 가리키도록 설정.
#
# 측정 (scripts/measure_grasp_roi.py 보조):
#   1) 카메라/목적지를 운영 배치로 두고, 빈 목적지 상태에서 스크립트를 띄운다.
#   2) 각 목적지를 드래그(또는 --roi)로 지정 → 콘솔의 'roi_px' 와 'z_median' 을 읽어
#      아래 roi_px / baseline_depth 에 입력한다 (e 표본 = 빈 목적지 baseline).
#   3) 물체를 놓은 상태(g 표본)의 median 과의 차이의 절반쯤을
#      depth_change_threshold 로 잡는다.
#   ※ 스크립트는 현재 미터 박스 yaml 을 출력하므로, destination_roi 포맷은
#     콘솔의 roi_px/median 을 보고 본 파일에 수기 입력한다.
#
# 필드:
#   depth_scale              — 16UC1 raw→m 스케일 (RealSense 기본 0.001). 32FC1 이면 무시.
#   depth_change_threshold   — baseline 대비 median 이 이만큼 작아지면 물체 있음 (m).
#   destinations.<domain>    — 도메인별 목적지 ROI 목록 (active_domain 으로 선택).
#                              한 도메인의 ROI 중 하나라도 흔적이 있으면 place True.
#     name                   — 목적지 식별자 (로그용; can_bin / target_area 등).
#     roi_px                 — [x0, y0, x1, y1] 픽셀 박스 (640x480 기준).
#     baseline_depth         — 빈 목적지일 때 ROI median depth (m).
#
# TODO: 아래 roi_px / baseline_depth 는 예시값 — 캘리브레이션·배치 확정 후 실측 갱신.

depth_scale: 0.001
depth_change_threshold: 0.02

destinations:
  # recycling: 객체별 분리 bin 3개 (generate_verify_qa.DESTINATIONS 와 동일 명칭)
  recycling:
    - name: can_bin
      roi_px: [120, 200, 220, 300]
      baseline_depth: 0.55
    - name: plastic_bin
      roi_px: [270, 200, 370, 300]
      baseline_depth: 0.55
    - name: paper_bin
      roi_px: [420, 200, 520, 300]
      baseline_depth: 0.55

  # tableware: 테이블 위 단일 목표 영역 (별도 통 자산 없음 — 평면)
  tableware:
    - name: target_area
      roi_px: [240, 220, 400, 340]
      baseline_depth: 0.50
