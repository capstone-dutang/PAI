# /etc/sysctl.d/99-llama-server-vm.conf
#
# llama-server (Gemma 4 E2B) 구동 시 메모리 단편화 완화용 커널 VM 튜닝.
# Jetson Orin Nano 8GB unified memory 에서 대용량 연속(higher-order) 할당
# (GPU/모델 로드) 실패·OOM 빈도를 줄인다.
#
# 설치:
#   sudo cp deploy/sysctl.d/99-llama-server-vm.conf /etc/sysctl.d/
#   sudo sysctl --system        # 즉시 적용 (재부팅 시 systemd-sysctl 가 자동 적용)
#
# 적용 확인:
#   sysctl vm.compaction_proactiveness vm.min_free_kbytes

# 백그라운드 메모리 압축(kcompactd)을 더 적극적으로 (기본 20). 연속 블록 확보 ↑, CPU ↑.
vm.compaction_proactiveness=100

# free 예약량 128MB. 압축/할당이 연속 블록을 유지하기 쉽게 함.
vm.min_free_kbytes=131072
