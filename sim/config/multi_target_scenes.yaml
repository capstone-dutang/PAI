# multi_target_scenes.yaml
#
# Sim teleop 데이터 수집(record_sim_teleop.py)의 multi-target 장면 구성.
#   - placement : SceneManager 가 매 에피소드 객체를 배치하는 영역·규칙
#   - scenes    : TargetSelector([D5])가 고르는 객체 카테고리 조합
#
# ACT shortcut learning 방지 — 한 장면에 후보 객체를 여럿 두고, 같은 시각
# 입력에 다른 언어 명령으로 다른 행동을 하는 에피소드를 의도적으로 만든다.

# 객체 라이브러리 — setup_recycling_objects.py 가 생성한 래퍼 USD 디렉터리.
# 카테고리는 래퍼 파일명 prefix (can_* / plastic_* / paper_*) 로 식별.
object_library: sim/assets/objects/recycling

# ── 객체 배치 규칙 (base_scene.usd 의 테이블·로봇 배치에 종속) ───────────────
placement:
  # spawn_region — 테이블 윗면 사각형 (world frame, m).
  # measure_placement.py 출력의 "테이블 footprint" 그대로 기입.
  spawn_region:
    x_range: [-1.5921, 1.5927]
    y_range: [-0.8126, 0.8132]

  # reach — 로봇 가동범위 (annular sector, world frame). 선택적:
  # 키가 없으면 spawn_region 사각형 전체에서 샘플(이전 동작). 있으면
  # SceneManager 가 사각형 ∩ 환형섹터 안에서만 객체를 배치한다 — SO-101 처럼
  # 가동범위가 반원/환형인 팔에 필요.
  # 축 규약: x+ = 로봇 정면(forward), y+ = 로봇 기준 왼쪽.
  # theta = atan2(dy, dx) [deg]. theta=0 → 정면, +90 → 왼쪽, -90 → 오른쪽.
  # ⚠️ probe_reach.py 로 r_min/r_max/theta 실측 후 기입.
  reach:
    center:          [-0.5, 0.0]     # 로봇 base world (x,y)
    r_range:         [0.115, 0.35]    # 최소·최대 도달 반경 (m)
    theta_range_deg: [-90.0, 90.0]   # 로봇 정면 기준 ±각도

  # 객체를 안착시킬 테이블 윗면 높이 (world z, m). ⚠️ base_scene 의 테이블 실측값.
  table_top_z: 0.0104

  # 객체 간 최소 중심 간격 (m) — 겹침 방지 rejection sampling.
  min_separation: 0.08

  # 빈(bin) footprint — 이 사각형과 겹치면 객체를 재샘플 (world frame, m).
  # ⚠️ base_scene.usd 의 bin_* prim 위치를 보고 실측값 기입.
  bin_exclusion:
    - {x_range: [-0.4250, -0.2700], y_range: [-0.4050, -0.2050]}   # bin_plastic
    - {x_range: [-0.3100, -0.1550], y_range: [-0.4050, -0.2050]}   # bin_can
    - {x_range: [-0.1950, -0.0400], y_range: [-0.4050, -0.2050]}  # bin_paper

  # rejection sampling 최대 시도 횟수.
  max_sample_attempts: 100

# ── 장면 정의 ── 각 장면 = 한 에피소드에 배치할 객체 카테고리 조합.
# count 만큼 해당 카테고리 래퍼에서 TargetSelector 가 구체 객체를 고른다.
#
# 씬 셋은 세 카테고리(can/plastic/paper)에 대칭으로 구성한다. TargetSelector 는
# 한 장면에 실제로 놓인 카테고리 중에서만 grasp 타겟을 고를 수 있으므로, 씬
# 셋이 비대칭이면(예: 같은-범주·단일 장면이 can 만 존재) 타겟이 그 카테고리로
# 쏠린다. multi(후보 2+) · single 두 계층 모두 카테고리 대칭이어야 타겟 분포가
# 고르게 된다.
scenes:
  # ── multi-target (후보 2+) ──
  - name: recycling_3cat            # 캔 + 플라스틱 + 종이
    objects:
      - {category: can,     count: 1}
      - {category: plastic, count: 1}
      - {category: paper,   count: 1}
  - name: recycling_2can            # 같은 범주 변별 — 캔
    objects:
      - {category: can, count: 2}
  - name: recycling_2plastic        # 같은 범주 변별 — 플라스틱
    objects:
      - {category: plastic, count: 2}
  - name: recycling_2paper          # 같은 범주 변별 — 종이
    objects:
      - {category: paper, count: 2}
  # ── single-target (후보 1) ──
  - name: recycling_single_can      # 단일 객체 — 캔
    objects:
      - {category: can, count: 1}
  - name: recycling_single_plastic  # 단일 객체 — 플라스틱
    objects:
      - {category: plastic, count: 1}
  - name: recycling_single_paper    # 단일 객체 — 종이
    objects:
      - {category: paper, count: 1}

# 전체 에피소드 중 multi-target(후보 2+) 장면 비율.
multi_target_ratio: 0.6
