# =============================================================================
# dr_config.yaml
# -----------------------------------------------------------------------------
# 목적: Isaac Sim에서 Part B-2(ACT 시연 데이터 생성) 시 적용할
#       Domain Randomization 파라미터 정의.
#
# 사용처: isaac_sim/generate_act_dataset.py 가 매 에피소드 시작 시 로드.
# 관련: README Part B-2, Part E (Co-training), Part G (held-out 평가)
#
# 원칙:
#   - 중심값(mean)은 실기(SO-101 + RealSense + 실제 조명) 환경을 기준으로 설정
#   - 분산(range)은 중심값 ± 로 표기, 에피소드마다 uniform 샘플링
#   - Part G held-out 평가용으로 일부 파라미터는 별도 범위로 재지정 예정
# =============================================================================


# -----------------------------------------------------------------------------
# [1] Visual Randomization (카메라 입력 도메인 갭 축소)
# -----------------------------------------------------------------------------
# lighting:
#   - 조명 방향 vector ± (반구형 랜덤)
#   - 조명 강도 (lux 또는 intensity)      : 중심값 ± 범위
#   - 색온도 (Kelvin)                     : 예) 4000~6500K
#   - 보조 광원(ambient) on/off 확률
#
# textures:
#   - 물체 재질: albedo color jitter, metallic/roughness 범위
#   - 테이블 텍스처: N종 텍스처 중 랜덤 선택
#   - 배경(벽/바닥) 텍스처: N종 중 랜덤 선택
#
# camera:
#   - FOV ± (실기 RealSense 기준값 미확인 — Part A 캘리브레이션 후 확정)
#   - 위치 offset (x, y, z) ± 수 mm (설치 오차 모사)
#   - 회전 offset (roll, pitch, yaw) ± 수 도
#
# distractors:
#   - 랜덤 방해 물체 N개 배치 확률/개수 범위


# -----------------------------------------------------------------------------
# [2] Physics Randomization (동역학 갭 축소)
# -----------------------------------------------------------------------------
# object_dynamics:
#   - mass (kg)                : 중심값 ± (물체 종류 확정 후 설정)
#   - friction (coef)          : static/dynamic 각각 범위
#   - inertia scale            : ±
#
# robot_dynamics (SO-101 / Feetech STS3215):
#   - joint PD gain            : Kp, Kd 각각 ± (중심값은 실기 측정 필요)
#   - joint friction           : 관절별 ±
#   - joint damping            : ±
#   - actuator latency (ms)    : ± (Feetech 버스 통신 지연 모사)
#   - backlash (rad)           : ± (저가 기어 백래시 모사)


# -----------------------------------------------------------------------------
# [3] Observation Noise (센서 노이즈 모사)
# -----------------------------------------------------------------------------
# joint_state_noise:
#   - Gaussian sigma (rad)     : 각 관절별
#
# rgb_noise:
#   - Gaussian pixel noise     : sigma
#   - Motion blur kernel       : 확률/크기
#   - JPEG compression artifact: quality 범위
#
# depth_noise:
#   - Hole probability         : 픽셀당 dropout 확률 (RealSense 특유)
#   - Speckle noise sigma      : 거리 비례 노이즈
#   - Edge artifact            : 물체 경계 depth 튀는 현상 모사


# -----------------------------------------------------------------------------
# [4] Task Randomization
# -----------------------------------------------------------------------------
# object_initial_pose:
#   - x range (m)              : 작업 공간 범위 (미결정)
#   - y range (m)              : 미결정
#   - yaw range (rad)          : 0 ~ 2π
#
# place_target:
#   - 목표 drop 위치 분포 (고정/랜덤 여부 미결정)


